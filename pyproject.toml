[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "monas-lens"
version = "0.1.0.dev0"
description = "Local-first repository intelligence for AI coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "ai",
    "code-intelligence",
    "developer-tools",
    "local-first",
    "repository",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "filelock>=3.18,<4",
    "pathspec>=0.12,<1",
    "platformdirs>=4.3,<5",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0.41,<3",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack==0.13.0",
    "typer>=0.16,<1",
]

[project.urls]
Documentation = "https://github.com/Chunn241529/MonasLens#readme"
Issues = "https://github.com/Chunn241529/MonasLens/issues"
Repository = "https://github.com/Chunn241529/MonasLens"

[project.scripts]
monas-lens = "monas_lens.cli:app"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "httpx>=0.28,<1",
    "pyright>=1.1.405,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.sdist]
include = [
    "/benchmarks",
    "/docs",
    "/src",
    "/tests",
    "/.env.example",
    "/LICENSE",
    "/PHASE_1_2_IMPLEMENTATION_TASKS.md",
    "/PHASE_3_IMPLEMENTATION_TASKS.md",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monas_lens"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "PTH",
    "RUF",
    "SIM",
    "UP",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=monas_lens",
    "--cov-branch",
    "--cov-fail-under=85",
    "--cov-report=term-missing",
    "-ra",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
    "src/monas_lens/__main__.py",
    "src/monas_lens/db/migrations/env.py",
    "src/monas_lens/db/migrations/versions/*.py",
]
source = ["monas_lens"]
